<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rick Lá Casa de Barba</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#0a0a0b;color:#f5f5f5;font-family:Arial,sans-serif}.wrap{max-width:560px;margin:auto;padding:20px}
h1{margin:0;color:#e7b84d;font-size:34px}.sub{letter-spacing:3px;color:#ddd}.card{background:#151517;border:1px solid #3d3423;border-radius:18px;padding:18px;margin-top:18px}
label{display:block;margin:13px 0 6px;color:#bbb}input,select,button{width:100%;padding:13px;border-radius:10px;border:1px solid #444;background:#101012;color:#fff;font-size:16px}
button{background:#e7b84d;color:#111;border:0;font-weight:700;margin-top:14px}button:disabled{opacity:.35}.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{background:#202023;margin:0}.selected{outline:2px solid #e7b84d}.msg{margin-top:14px;padding:12px;border-radius:10px;background:#172317;color:#c9f6c9}.err{background:#321919;color:#ffbaba}small{color:#aaa}
</style></head><body><div class="wrap">
<h1>RICK</h1><div class="sub">LÁ CASA DE BARBA</div>
<p><small>Aparecida D'Oeste - SP · Rick · Segunda a sábado · 09:00 às 19:00</small></p>
<div class="card"><h2>Agendar horário</h2>
<label>Serviço</label><select id="service"></select>
<label>Nome</label><input id="name" placeholder="Seu nome">
<label>WhatsApp</label><input id="phone" placeholder="(17) 99777-6894" inputmode="tel">
<label>Data</label><input id="date" type="date">
<label>Horário</label><div id="slots" class="slots"></div>
<button id="book">Confirmar agendamento</button><div id="status"></div>
</div></div>
<script>
const SUPABASE_URL="https://rmnoasgfvnfyuusicuur.supabase.co";
const SUPABASE_KEY="sb_publishable_bf864XePwlkMSnJhseQf_Q_Li63u0DK";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const times=["09:00","09:30","10:00","10:30","11:00","11:30","13:30","14:00","14:30","15:00","15:30","16:00","16:30","17:00","17:30","18:00","18:30"];
let selectedTime=null; const $=s=>document.querySelector(s);
function status(t,err=false){$("#status").innerHTML='<div class="'+(err?'msg err':'msg')+'">'+t+'</div>'}
async function services(){const {data,error}=await sb.from("services").select("id,name,price").eq("active",true).order("id");if(error){status("Erro ao carregar serviços: "+error.message,true);return}$("#service").innerHTML=data.map(x=>`<option value="${x.id}">${x.name} — R$ ${Number(x.price).toFixed(2).replace(".",",")}</option>`).join("")}
function slots(booked=[]){selectedTime=null;$("#slots").innerHTML="";const busy=new Set(booked.map(x=>String(x.appointment_time).slice(0,5)));times.forEach(t=>{const b=document.createElement("button");b.type="button";b.textContent=t;b.className="slot";b.disabled=busy.has(t);if(!b.disabled)b.onclick=()=>{selectedTime=t;document.querySelectorAll(".slot").forEach(x=>x.classList.remove("selected"));b.classList.add("selected")};$("#slots").appendChild(b)})}
async function loadSlots(){if(!$("#date").value){slots();return}const d=new Date($("#date").value+"T12:00:00");if(d.getDay()===0){slots();status("Domingo: a barbearia não funciona.",true);return}const {data,error}=await sb.rpc("get_booked_slots",{p_date:$("#date").value});if(error){status("Execute primeiro o SQL das funções de agendamento.",true);return}slots(data||[])}
$("#date").addEventListener("change",loadSlots);
$("#book").onclick=async()=>{const name=$("#name").value.trim(),phone=$("#phone").value.trim(),date=$("#date").value;if(!name||!phone||!date||!selectedTime){status("Preencha nome, WhatsApp, data e horário.",true);return}const {error}=await sb.rpc("book_appointment",{p_service_id:Number($("#service").value),p_date:date,p_time:selectedTime,p_client_name:name,p_client_phone:phone});if(error){status(error.message,true);loadSlots();return}const svc=$("#service").options[$("#service").selectedIndex].text;const msg=`Olá! Sou ${name}. Meu agendamento na Rick Lá Casa de Barba foi confirmado: ${svc}, ${date.split("-").reverse().join("/")} às ${selectedTime}.`;status("Agendamento confirmado! Abrindo o WhatsApp.");window.open("https://wa.me/5517997776894?text="+encodeURIComponent(msg),"_blank");loadSlots()};
services();slots();
</script></body></html>
