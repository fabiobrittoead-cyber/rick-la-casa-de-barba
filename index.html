<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rick Lá Casa de Barba</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0a0a0b;color:#fff;font-family:Arial,sans-serif}
.wrap{max-width:560px;margin:auto;padding:25px}
h1{margin:0;color:#e7b84d;font-size:38px}
.sub{letter-spacing:4px;color:#ddd}
.info{color:#aaa;line-height:1.5}
.card{background:#151517;border:1px solid #4a3b20;border-radius:18px;padding:20px;margin-top:25px}
label{display:block;margin:14px 0 7px;color:#ccc}
input,select{width:100%;padding:15px;border:1px solid #555;border-radius:11px;background:#101012;color:#fff;font-size:16px}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{padding:13px;border:0;border-radius:10px;background:#29292d;color:#fff}
.slot:disabled{opacity:.25}
.selected{outline:2px solid #e7b84d}
#book{width:100%;margin-top:20px;padding:16px;border:0;border-radius:11px;background:#e7b84d;color:#111;font-weight:bold;font-size:17px}
.msg{margin-top:15px;padding:12px;border-radius:10px;background:#183019}
.err{background:#401b1b}
</style>
</head>

<body>
<div class="wrap">

<h1>RICK</h1>
<div class="sub">LÁ CASA DE BARBA</div>

<div class="info">
Aparecida D'Oeste - SP · Rick<br>
Segunda a sábado · 09:00 às 19:00
</div>

<div class="card">
<h2>Agendar horário</h2>

<label>Serviço</label>
<select id="service">
<option value="1">Barba — R$ 30,00</option>
<option value="2">Corte navalhado — R$ 40,00</option>
<option value="3">Corte navalhado + Barba — R$ 70,00</option>
<option value="4">Corte social — R$ 35,00</option>
<option value="5">Corte social + barba — R$ 65,00</option>
</select>

<label>Nome</label>
<input id="name" placeholder="Seu nome">

<label>WhatsApp</label>
<input id="phone" placeholder="(17) 99777-6894">

<label>Data</label>
<input id="date" type="date">

<label>Horário</label>
<div id="slots" class="slots"></div>

<button id="book">CONFIRMAR AGENDAMENTO</button>
<div id="status"></div>
</div>
</div>

<script>
const URL="https://rmnoasgfvnfyuusicuur.supabase.co";
const KEY="sb_publishable_bf864XePwlkMSnJhseQf_Q_Li63u0DK";
const db=supabase.createClient(URL,KEY);

const horarios=[
"09:00","09:30","10:00","10:30","11:00","11:30",
"13:30","14:00","14:30","15:00","15:30","16:00",
"16:30","17:00","17:30","18:00","18:30"
];

let horarioEscolhido=null;

function mostrar(msg,erro=false){
document.getElementById("status").innerHTML=
`<div class="msg ${erro?"err":""}">${msg}</div>`;
}

function criarHorarios(bloqueados=[]){
horarioEscolhido=null;
const area=document.getElementById("slots");
area.innerHTML="";

const ocupados=new Set(
bloqueados.map(x=>String(x.appointment_time).slice(0,5))
);

horarios.forEach(h=>{
const b=document.createElement("button");
b.type="button";
b.className="slot";
b.textContent=h;
b.disabled=ocupados.has(h);

b.onclick=()=>{
horarioEscolhido=h;
document.querySelectorAll(".slot")
.forEach(x=>x.classList.remove("selected"));
b.classList.add("selected");
};

area.appendChild(b);
});
}

async function carregarHorarios(){
const data=document.getElementById("date").value;

if(!data){
criarHorarios();
return;
}

const dia=new Date(data+"T12:00:00").getDay();

if(dia===0){
criarHorarios();
mostrar("A barbearia não funciona aos domingos.",true);
return;
}

const {data:ocupados,error}=await db.rpc(
"get_booked_slots",{p_date:data}
);

if(error){
criarHorarios();
mostrar("Erro ao consultar horários.",true);
return;
}

criarHorarios(ocupados||[]);
}

document.getElementById("date")
.addEventListener("change",carregarHorarios);

document.getElementById("book").onclick=async()=>{

const nome=document.getElementById("name").value.trim();
const telefone=document.getElementById("phone").value.trim();
const data=document.getElementById("date").value;
const servico=Number(document.getElementById("service").value);

if(!nome||!telefone||!data||!horarioEscolhido){
mostrar("Preencha nome, WhatsApp, data e horário.",true);
return;
}

const {error}=await db.rpc(
"book_appointment",
{
p_service_id:servico,
p_date:data,
p_time:horarioEscolhido,
p_client_name:nome,
p_client_phone:telefone
}
);

if(error){
mostrar(error.message,true);
carregarHorarios();
return;
}

const select=document.getElementById("service");
const servicoNome=select.options[select.selectedIndex].text;

const dataBR=data.split("-").reverse().join("/");

const mensagem=
`Olá! Sou ${nome}.

Meu agendamento na Rick Lá Casa de Barba foi confirmado.

Serviço: ${servicoNome}
Data: ${dataBR}
Horário: ${horarioEscolhido}`;

mostrar("Agendamento confirmado! Abrindo o WhatsApp.");

window.open(
"https://wa.me/5517997776894?text="+
encodeURIComponent(mensagem),
"_blank"
);

carregarHorarios();
};

criarHorarios();
</script>

</body>
</html>
